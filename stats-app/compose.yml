services:
  witstats-postgrest-rewriter:
    image: techcoderx/witreward-stats-rewriter:${WITSTATS_HAF_VERSION:-${HIVE_API_NODE_VERSION}}
    profiles:
      - apps
      - witstats
    networks:
      haf-network:
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:8080/curation || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 1m
    depends_on:
      haf-stats-postgrest:
        condition: service_healthy
      haf:
        condition: service_healthy